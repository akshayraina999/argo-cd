apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-parent-suite
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_USERNAME/YOUR_REPO_NAME.git' # <-- Update with your actual repo details
    targetRevision: main
    path: knative
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true