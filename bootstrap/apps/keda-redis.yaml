apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-redis
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/akshayraina999/keda-gitops.git
    targetRevision: HEAD
    path: helm/keda-redis
    helm:
      valueFiles:
        - ../../envs/dev-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: kafka

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true